<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简单加法测试器</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;}
body{max-width:500px;margin:40px auto;padding:0 20px;background:#111;color:#eee;}
.box{background:#222;padding:24px;border-radius:12px;}
label{display:block;margin:12px 0 4px;}
input{width:100%;padding:10px;border-radius:6px;border:none;font-size:16px;}
button{width:100%;margin-top:18px;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
#res{margin-top:20px;padding:14px;background:#1a1a1a;border-radius:8px;}
</style>
</head>
<body>
<div class="box">
<h2>加法测试工具</h2>
<label>数字A</label>
<input id="a" type="number" step="any">
<label>数字B</label>
<input id="b" type="number" step="any">
<button id="btn">计算A+B</button>
<div id="res"></div>
</div>
<script>
const btn = document.getElementById("btn");
btn.onclick = function(){
    const a = parseFloat(document.getElementById("a").value);
    const b = parseFloat(document.getElementById("b").value);
    if(isNaN(a)||isNaN(b)){
        document.getElementById("res").innerText = "请输入有效的数字！";
        return;
    }
    document.getElementById("res").innerText = `结果：${a} + ${b} = ${a+b}`;
}
</script>
</body>
</html>
