<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三数找最大值</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;}
body{max-width:500px;margin:40px auto;padding:0 20px;background:#111;color:#eee;}
.box{background:#222;padding:24px;border-radius:12px;}
label{display:block;margin:12px 0 4px;}
input{width:100%;padding:10px;border-radius:6px;border:none;font-size:16px;}
button{width:100%;margin-top:18px;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
#res{margin-top:20px;padding:14px;background:#1a1a1a;border-radius:8px;}
</style>
</head>
<body>
<div class="box">
    <h2>输入三个数字，找出最大值</h2>
    <label>数字A</label>
    <input id="a" type="number">
    <label>数字B</label>
    <input id="b" type="number">
    <label>数字C</label>
    <input id="c" type="number">
    <button id="btn">找出最大数</button>
    <div id="res"></div>
</div>

<script>
// 绑定按钮
const btn = document.getElementById("btn");
btn.onclick = function(){
    // 读取三个输入框，转数字，等价于 a=int(input())
    let a = parseInt(document.getElementById("a").value);
    let b = parseInt(document.getElementById("b").value);
    let c = parseInt(document.getElementById("c").value);

    // 判断空输入校验
    if(isNaN(a) || isNaN(b) || isNaN(c)){
        document.getElementById("res").innerText = "⚠️ 请输入有效的整数！";
        return;
    }

    // ========== 这里就是和你Python一模一样的嵌套if逻辑！==========
    let maxNum;
    if (a > b) {
        if (a > c) {
            maxNum = a;
        } else {
            maxNum = c;
        }
    } else {
        if (b > c) {
            maxNum = b;
        } else {
            maxNum = c;
        }
    }
    // =============================================================

    // 输出到页面，等价 print()
    document.getElementById("res").innerText = `三个数中最大的数字是：${maxNum}`;
}
</script>
</body>
</html>
